<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Banner exportieren – KI IHK</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a0e14;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #94a3b8; max-width: 640px; text-align: center; line-height: 1.45; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
    button {
      appearance: none;
      border: 1px solid rgba(34, 211, 238, 0.45);
      background: linear-gradient(180deg, #0e7490, #0f4c5c);
      color: #ecfeff;
      font: 600 15px/1 "Segoe UI", system-ui, sans-serif;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary {
      background: #111827;
      border-color: #334155;
      color: #cbd5e1;
    }
    .meta { font-size: 13px; color: #64748b; margin-bottom: 16px; font-variant-numeric: tabular-nums; }
    .frame {
      width: min(100%, 1100px);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
      background: #000;
    }
    canvas#preview {
      display: block;
      width: 100%;
      height: auto;
    }
    canvas#full { display: none; }
    .safe-note {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>YouTube-Kanalbanner</h1>
  <p>
    2560 × 1440 px · unter 6&nbsp;MB · Text in der Safe Area (sichtbar auf TV, Desktop &amp; Mobile).
    Klick auf <strong>PNG herunterladen</strong> oder warte auf den Auto-Download.
  </p>
  <div class="actions">
    <button type="button" id="btnDownload">PNG herunterladen</button>
    <button type="button" class="secondary" id="btnJpg">JPG herunterladen (kleiner)</button>
  </div>
  <div class="meta" id="meta">Generiere…</div>
  <div class="frame"><canvas id="preview" width="1280" height="720"></canvas></div>
  <p class="safe-note">YouTube Safe Area: mittlerer Bereich ca. 1546 × 423 px — dort steht der Haupttext.</p>
  <canvas id="full" width="2560" height="1440"></canvas>

  <script>
    const W = 2560, H = 1440;

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawBanner(ctx, w, h) {
      // background
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, "#070b12");
      bg.addColorStop(0.45, "#0c1522");
      bg.addColorStop(1, "#080e16");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // radial glows
      const g1 = ctx.createRadialGradient(w * 0.18, h * 0.55, 0, w * 0.18, h * 0.55, w * 0.35);
      g1.addColorStop(0, "rgba(14, 116, 144, 0.32)");
      g1.addColorStop(1, "rgba(14, 116, 144, 0)");
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, w, h);

      const g2 = ctx.createRadialGradient(w * 0.82, h * 0.4, 0, w * 0.82, h * 0.4, w * 0.3);
      g2.addColorStop(0, "rgba(30, 64, 175, 0.22)");
      g2.addColorStop(1, "rgba(30, 64, 175, 0)");
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, w, h);

      const g3 = ctx.createRadialGradient(w * 0.5, h * 0.48, 0, w * 0.5, h * 0.48, w * 0.28);
      g3.addColorStop(0, "rgba(34, 211, 238, 0.12)");
      g3.addColorStop(1, "rgba(34, 211, 238, 0)");
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, w, h);

      // top accent line
      const topLine = ctx.createLinearGradient(0, 0, w, 0);
      topLine.addColorStop(0, "transparent");
      topLine.addColorStop(0.25, "#0891b2");
      topLine.addColorStop(0.5, "#22d3ee");
      topLine.addColorStop(0.75, "#0891b2");
      topLine.addColorStop(1, "transparent");
      ctx.fillStyle = topLine;
      ctx.fillRect(0, 0, w, 4);

      // grid
      ctx.save();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.06)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= w; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y <= h; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      ctx.restore();

      // corner brackets
      ctx.strokeStyle = "rgba(34, 211, 238, 0.35)";
      ctx.lineWidth = 2;
      const b = 48, s = 48;
      // TL
      ctx.beginPath(); ctx.moveTo(b, b + s); ctx.lineTo(b, b); ctx.lineTo(b + s, b); ctx.stroke();
      // TR
      ctx.beginPath(); ctx.moveTo(w - b - s, b); ctx.lineTo(w - b, b); ctx.lineTo(w - b, b + s); ctx.stroke();
      // BL
      ctx.beginPath(); ctx.moveTo(b, h - b - s); ctx.lineTo(b, h - b); ctx.lineTo(b + s, h - b); ctx.stroke();
      // BR
      ctx.beginPath(); ctx.moveTo(w - b - s, h - b); ctx.lineTo(w - b, h - b); ctx.lineTo(w - b, h - b - s); ctx.stroke();

      // neural network left
      const nodes = [
        [120, 380], [90, 520], [130, 660], [100, 800],
        [280, 340], [300, 480], [290, 620], [310, 760], [280, 900],
        [460, 420], [480, 560], [450, 700], [470, 840],
      ];
      const edges = [
        [0,4],[0,5],[1,4],[1,5],[1,6],[2,5],[2,6],[2,7],[3,6],[3,7],[3,8],
        [4,9],[5,9],[5,10],[6,10],[6,11],[7,11],[7,12],[8,12],
        [4,5],[5,6],[6,7],[7,8],[9,10],[10,11],[11,12],
      ];
      ctx.strokeStyle = "rgba(34, 211, 238, 0.28)";
      ctx.lineWidth = 1.5;
      for (const [a, b] of edges) {
        const [x1, y1] = nodes[a], [x2, y2] = nodes[b];
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      for (let i = 0; i < nodes.length; i++) {
        const [x, y] = nodes[i];
        const r = i < 4 || i >= 9 ? 5.5 : 7;
        ctx.beginPath();
        ctx.fillStyle = "rgba(34, 211, 238, 0.9)";
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        if (i === 5 || i === 10) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(103, 232, 249, 0.35)";
          ctx.lineWidth = 1.5;
          ctx.arc(x, y, r + 12, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // bars right
      const barH = [0.28, 0.48, 0.38, 0.72, 0.55, 0.88, 0.62, 0.45, 0.78, 0.35];
      const barBaseY = 1040;
      const barMax = 420;
      const barX0 = 2080;
      const barW = 26;
      const gap = 14;
      for (let i = 0; i < barH.length; i++) {
        const bh = barMax * barH[i];
        const x = barX0 + i * (barW + gap);
        const y = barBaseY - bh;
        const grad = ctx.createLinearGradient(x, barBaseY, x, y);
        grad.addColorStop(0, "rgba(34, 211, 238, 0.12)");
        grad.addColorStop(1, "rgba(34, 211, 238, 0.55)");
        ctx.fillStyle = grad;
        roundRect(ctx, x, y, barW, bh, 5);
        ctx.fill();
      }

      // SAFE AREA content (center 1546 x 423)
      const cx = w / 2;
      const cy = h / 2;

      // badge
      const badgeText = "IHK  ·  KI & MASCHINELLES LERNEN";
      ctx.font = "500 22px 'Segoe UI', Arial, sans-serif";
      const badgeW = ctx.measureText(badgeText).width + 56;
      const badgeH = 44;
      const badgeX = cx - badgeW / 2;
      const badgeY = cy - 150;
      ctx.fillStyle = "rgba(8, 20, 30, 0.8)";
      ctx.strokeStyle = "rgba(34, 211, 238, 0.4)";
      ctx.lineWidth = 1.5;
      roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 999);
      ctx.fill();
      ctx.stroke();
      // badge dot
      ctx.beginPath();
      ctx.fillStyle = "#22d3ee";
      ctx.shadowColor = "#22d3ee";
      ctx.shadowBlur = 12;
      ctx.arc(badgeX + 22, badgeY + badgeH / 2, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#67e8f9";
      ctx.font = "600 20px 'Segoe UI', Consolas, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(badgeText, badgeX + 38, badgeY + badgeH / 2 + 1);

      // title
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#f8fafc";
      ctx.font = "700 70px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Kompletter Lehrstoff als", cx, cy - 40);

      // accent word with gradient simulation (solid cyan-ish)
      const accent = "Erklärvideos";
      ctx.font = "700 76px 'Segoe UI', Arial, sans-serif";
      // gradient fill for text
      const tw = ctx.measureText(accent).width;
      const tg = ctx.createLinearGradient(cx - tw / 2, 0, cx + tw / 2, 0);
      tg.addColorStop(0, "#22d3ee");
      tg.addColorStop(0.5, "#67e8f9");
      tg.addColorStop(1, "#a5f3fc");
      ctx.fillStyle = tg;
      ctx.fillText(accent, cx, cy + 42);

      // subtitle
      ctx.fillStyle = "#94a3b8";
      ctx.font = "500 28px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Berufsspezialist  &  Bachelor Professional in KI und ML (IHK)", cx, cy + 118);

      // chips
      const chips = ["12 Module", "Praxisprojekte", "Prüfungsfit"];
      ctx.font = "600 20px 'Segoe UI', Arial, sans-serif";
      const chipPads = chips.map((t) => ({ t, w: ctx.measureText(t).width + 36 }));
      const totalChips = chipPads.reduce((s, c) => s + c.w, 0) + 16 * (chips.length - 1);
      let chipX = cx - totalChips / 2;
      const chipY = cy + 160;
      for (const c of chipPads) {
        ctx.fillStyle = "rgba(15, 40, 55, 0.75)";
        ctx.strokeStyle = "rgba(34, 211, 238, 0.4)";
        ctx.lineWidth = 1.25;
        roundRect(ctx, chipX, chipY, c.w, 38, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#a5f3fc";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(c.t, chipX + c.w / 2, chipY + 20);
        chipX += c.w + 16;
      }

      // footers (outside tight mobile crop but ok on desktop)
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#22d3ee";
      ctx.beginPath(); ctx.arc(64, h - 56, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#64748b";
      ctx.font = "500 22px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Prüfungsorientiert  ·  Praxisnah  ·  Strukturiert", 78, h - 56);

      ctx.textAlign = "right";
      ctx.fillStyle = "#2dd4bf";
      ctx.beginPath(); ctx.arc(w - 64, h - 56, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#64748b";
      ctx.fillText("DQR 5  ·  DQR 6", w - 78, h - 56);
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 1500);
    }

    function exportPng() {
      return new Promise((resolve) => {
        full.toBlob((blob) => resolve(blob), "image/png");
      });
    }

    function exportJpg(q = 0.92) {
      return new Promise((resolve) => {
        full.toBlob((blob) => resolve(blob), "image/jpeg", q);
      });
    }

    const full = document.getElementById("full");
    const preview = document.getElementById("preview");
    const meta = document.getElementById("meta");
    const fctx = full.getContext("2d");
    const pctx = preview.getContext("2d");

    drawBanner(fctx, W, H);
    // scaled preview
    pctx.fillStyle = "#000";
    pctx.fillRect(0, 0, preview.width, preview.height);
    pctx.drawImage(full, 0, 0, preview.width, preview.height);

    exportPng().then((blob) => {
      const mb = (blob.size / (1024 * 1024)).toFixed(2);
      meta.textContent = `PNG bereit: 2560 × 1440 · ${mb} MB` + (blob.size > 6 * 1024 * 1024 ? " ⚠ über 6 MB – nutze JPG" : " ✓ unter 6 MB");
      // auto download once
      if (!sessionStorage.getItem("bannerDownloaded")) {
        downloadBlob(blob, "youtube-banner-2560x1440.png");
        sessionStorage.setItem("bannerDownloaded", "1");
      }
    });

    document.getElementById("btnDownload").addEventListener("click", async () => {
      const blob = await exportPng();
      downloadBlob(blob, "youtube-banner-2560x1440.png");
      meta.textContent = `PNG: 2560 × 1440 · ${(blob.size / (1024 * 1024)).toFixed(2)} MB`;
    });

    document.getElementById("btnJpg").addEventListener("click", async () => {
      const blob = await exportJpg(0.92);
      downloadBlob(blob, "youtube-banner-2560x1440.jpg");
      meta.textContent = `JPG: 2560 × 1440 · ${(blob.size / (1024 * 1024)).toFixed(2)} MB`;
    });
  </script>
</body>
</html>
