<script>
/* Rechner in Modul 13 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var ids = ["nwG1", "nwG2", "nwG3", "nwA1", "nwA2", "nwA3", "nwB1", "nwB2", "nwB3"];
  var el = ids.map(function (id) { return document.getElementById(id); });
  function nutzwert() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var gs = v[0] + v[1] + v[2];
    var w = gs ? [v[0] / gs, v[1] / gs, v[2] / gs] : [0, 0, 0];
    var a = [v[3], v[4], v[5]], b = [v[6], v[7], v[8]];
    var nA = w[0] * a[0] + w[1] * a[1] + w[2] * a[2], nB = w[0] * b[0] + w[1] * b[1] + w[2] * b[2];
    var r = w[0] + w[2], rA = r ? (w[0] * a[0] + w[2] * a[2]) / r : 0, rB = r ? (w[0] * b[0] + w[2] * b[2]) / r : 0;
    var den = (a[1] - b[1]) + (rB - rA), x = den ? (rB - rA) / den : NaN;
    var krit = isFinite(x) && x >= 0 && x <= 1 ? fmt(x * 100, 1) + " %" : "kein Umkippen";
    document.getElementById("nwOut").innerHTML = kpi("Nutzwert A", fmt(nA, 2)) + kpi("Nutzwert B", fmt(nB, 2)) +
      kpi("vorn", Math.abs(nA - nB) < 1e-9 ? "gleich" : nA > nB ? "A" : "B") + kpi("kritisches Gewicht K2", krit);
    document.getElementById("nwNote").textContent = (gs !== 100 ? "Gewichte ergeben " + fmt(gs) + " % und wurden auf 100 % normiert. " : "") +
      "Kritisches Gewicht: Bei diesem Gewicht für Kriterium 2 (übrige im gleichen Verhältnis) sind A und B gleichauf.";
  }
  el.forEach(function (e) { e.addEventListener("input", nutzwert); }); nutzwert();

  var ro = ["roI", "roE", "roK", "roN"].map(function (id) { return document.getElementById(id); });
  function roi() {
    var v = ro.map(function (e) { return Math.max(0, +e.value || 0); });
    var I = v[0], rf = v[1] - v[2], n = v[3], tot = rf * n, gew = tot - I;
    document.getElementById("roOut").innerHTML = kpi("Rückfluss je Jahr", fmt(rf) + " €") + kpi("Amortisation", rf > 0 ? fmt(I / rf, 2) + " Jahre" : "nie") +
      kpi("Rückflüsse gesamt", fmt(tot) + " €") + kpi("Überschuss", fmt(gew) + " €") + kpi("ROI gesamt", I ? fmt(gew / I * 100, 1) + " %" : "–") + kpi("ROI je Jahr (Ø)", I && n ? fmt(gew / I / n * 100, 1) + " %" : "–");
    document.getElementById("roNote").textContent = rf > 0 && I / rf > n ? "Achtung: Die Investition amortisiert sich nicht innerhalb der Nutzungsdauer." : "Statische Rechnung ohne Zinsen; dynamische Verfahren in Modul 14.";
  }
  ro.forEach(function (e) { e.addEventListener("input", roi); }); roi();
})();
</script>
