<script>
/* Rechner in Modul 2 */
(function () {
  function parseList(s) { return s.split(/[;\s]+/).map(function (t) { return t.trim().replace(",", "."); }).filter(function (t) { return t !== ""; }).map(Number).filter(function (n) { return isFinite(n); }); }
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 2 : d }) : "–"; }
  // Quantil nach der Methode p·(n+1) mit linearer Interpolation (wie im Kurs)
  function quantil(s, p) {
    var pos = p * (s.length + 1);
    if (pos <= 1) return s[0];
    if (pos >= s.length) return s[s.length - 1];
    var k = Math.floor(pos), f = pos - k;
    return s[k - 1] + f * (s[k] - s[k - 1]);
  }
  var inp = document.getElementById("lsInput");
  function rechne() {
    var v = parseList(inp.value), out = document.getElementById("lsOut"), note = document.getElementById("lsNote");
    if (v.length < 2) { out.innerHTML = ""; note.textContent = "Bitte mindestens zwei Zahlen eingeben."; return; }
    var s = v.slice().sort(function (a, b) { return a - b; }), n = s.length;
    var mean = v.reduce(function (a, b) { return a + b; }, 0) / n;
    var med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    var cnt = {}, best = 0;
    v.forEach(function (x) { cnt[x] = (cnt[x] || 0) + 1; if (cnt[x] > best) best = cnt[x]; });
    var modus = best > 1 ? Object.keys(cnt).filter(function (k) { return cnt[k] === best; }).map(Number).sort(function (a, b) { return a - b; }).map(function (x) { return fmt(x); }).join(" · ") : "keiner";
    var varS = v.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / (n - 1);
    var q1 = quantil(s, 0.25), q3 = quantil(s, 0.75), iqr = q3 - q1;
    var lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
    var aus = v.filter(function (x) { return x < lo || x > hi; });
    var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
    out.innerHTML = kpi("Anzahl n", n) + kpi("Mittelwert", fmt(mean)) + kpi("Median", fmt(med)) + kpi("Modus", modus) +
      kpi("Spannweite", fmt(s[n - 1] - s[0])) + kpi("Varianz s²", fmt(varS)) + kpi("Standardabw. s", fmt(Math.sqrt(varS))) +
      kpi("Q1", fmt(q1)) + kpi("Q3", fmt(q3)) + kpi("IQR", fmt(iqr));
    note.textContent = "Ausreißergrenzen nach Tukey: unter " + fmt(lo) + " oder über " + fmt(hi) + ". " +
      (aus.length ? "Ausreißer: " + aus.map(function (x) { return fmt(x); }).join(", ") + "." : "Keine Ausreißer.") +
      " Varianz mit n − 1 (Stichprobe); Quartile nach der Methode p·(n+1).";
  }
  inp.addEventListener("input", rechne); rechne();
})();
</script>
