<script>
/* Rechner in Modul 3 */
(function () {
  function parseList(s) { return s.split(/[;\s]+/).map(function (t) { return t.trim().replace(",", "."); }).filter(function (t) { return t !== ""; }).map(Number).filter(function (n) { return isFinite(n); }); }
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 3 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };

  // Satz von Bayes
  var bp = document.getElementById("bayP"), bs = document.getElementById("baySens"), bf = document.getElementById("bayFp");
  function bayes() {
    var p = (+bp.value) / 100, s = (+bs.value) / 100, f = (+bf.value) / 100;
    var pos = s * p + f * (1 - p);
    var post = pos > 0 ? s * p / pos : NaN;
    document.getElementById("bayOut").innerHTML = kpi("P(B) – Alarm insgesamt", fmt(pos * 100, 2) + " %") + kpi("P(A | B) – Alarm ist echt", fmt(post * 100, 1) + " %") +
      kpi("Je 10.000 Fälle: echte Alarme", fmt(s * p * 10000, 0)) + kpi("Je 10.000 Fälle: Fehlalarme", fmt(f * (1 - p) * 10000, 0));
    document.getElementById("bayNote").textContent = "P(A | B) = P(B | A) · P(A) / P(B). Erhöhen Sie die Basisrate und beobachten Sie, wie der Anteil echter Alarme steigt.";
  }
  [bp, bs, bf].forEach(function (el) { el.addEventListener("input", bayes); }); bayes();

  // Lineare Regression
  var ix = document.getElementById("lrX"), iy = document.getElementById("lrY");
  function regression() {
    var x = parseList(ix.value), y = parseList(iy.value), out = document.getElementById("lrOut"), note = document.getElementById("lrNote");
    if (x.length < 2 || x.length !== y.length) { out.innerHTML = ""; note.textContent = "Bitte gleich viele x- und y-Werte eingeben (mindestens zwei)."; return; }
    var n = x.length, mx = x.reduce(function (a, b) { return a + b; }, 0) / n, my = y.reduce(function (a, b) { return a + b; }, 0) / n;
    var sxy = 0, sxx = 0, sst = 0;
    for (var i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) * (x[i] - mx); sst += (y[i] - my) * (y[i] - my); }
    if (sxx === 0) { out.innerHTML = ""; note.textContent = "Alle x-Werte sind gleich – keine Gerade bestimmbar."; return; }
    var b1 = sxy / sxx, b0 = my - b1 * mx, sse = 0;
    for (var j = 0; j < n; j++) { var e = y[j] - (b0 + b1 * x[j]); sse += e * e; }
    var r2 = sst > 0 ? 1 - sse / sst : NaN;
    out.innerHTML = kpi("x̄", fmt(mx)) + kpi("ȳ", fmt(my)) + kpi("Σ(x−x̄)(y−ȳ)", fmt(sxy)) + kpi("Σ(x−x̄)²", fmt(sxx)) + kpi("b₁", fmt(b1)) + kpi("b₀", fmt(b0)) + kpi("Σ Residuen²", fmt(sse)) + kpi("R²", fmt(r2));
    note.textContent = "ŷ = " + fmt(b0) + " + " + fmt(b1) + " · x";
  }
  [ix, iy].forEach(function (el) { el.addEventListener("input", regression); }); regression();
})();
</script>
