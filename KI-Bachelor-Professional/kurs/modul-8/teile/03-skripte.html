/* Rechner in Modul 8 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 1 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["prB", "prW", "prT", "prF", "prK", "prA"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var b = v[0], w = v[1], t = v[2], f = v[3], k = v[4], a = v[5];
    var dlz = b + w + t, eff = dlz ? b / dlz : NaN, std = f * b / 60, pers = a ? std / a : NaN;
    document.getElementById("prOut").innerHTML = kpi("Durchlaufzeit", fmt(dlz, 0) + " min") + kpi("= Arbeitstage (8 h)", fmt(dlz / 480, 2)) + kpi("Prozesseffizienz", fmt(eff * 100) + " %") +
      kpi("Arbeitsstunden je Tag", fmt(std)) + kpi("Personen (aufgerundet)", isFinite(pers) ? Math.ceil(pers - 1e-9) : "–") + kpi("Kosten je Fall", fmt(b / 60 * k, 2) + " €") + kpi("Kosten je Tag", fmt(std * k, 0) + " €");
    document.getElementById("prNote").textContent = "Durchlaufzeit = Bearbeitung + Warten + Transport; Personen = Fälle · Bearbeitungszeit / verfügbare Zeit.";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
