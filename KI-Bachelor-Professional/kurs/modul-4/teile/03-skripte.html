/* Rechner in Modul 4 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 1 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var ids = ["cmTP", "cmFP", "cmFN", "cmTN", "cmKfn", "cmKfp"];
  var el = ids.map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var tp = v[0], fp = v[1], fn = v[2], tn = v[3], kfn = v[4], kfp = v[5], n = tp + fp + fn + tn;
    var acc = n ? (tp + tn) / n : NaN, pre = tp + fp ? tp / (tp + fp) : NaN, rec = tp + fn ? tp / (tp + fn) : NaN;
    var f1 = pre + rec ? 2 * pre * rec / (pre + rec) : NaN, spe = tn + fp ? tn / (tn + fp) : NaN;
    var h = kpi("Accuracy", fmt(acc * 100) + " %") + kpi("Precision", fmt(pre * 100) + " %") + kpi("Recall", fmt(rec * 100) + " %") + kpi("F1", fmt(f1, 3)) + kpi("Spezifität", fmt(spe * 100) + " %");
    if (kfn || kfp) h += kpi("Fehlerkosten", fmt(fn * kfn + fp * kfp, 0) + " €");
    document.getElementById("cmOut").innerHTML = h;
    document.getElementById("cmNote").textContent = "n = " + n + ". Basisrate (Anteil positiv) = " + fmt(n ? (tp + fn) / n * 100 : NaN) + " %." + (kfn || kfp ? " Kosten = FN · " + kfn + " € + FP · " + kfp + " €." : "");
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
