/* Rechner in Modul 6 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 1 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["faNa", "faSa", "faNb", "faSb"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var qa = v[0] ? v[1] / v[0] : NaN, qb = v[2] ? v[3] / v[2] : NaN;
    var lo = Math.min(qa, qb), hi = Math.max(qa, qb), ratio = hi ? lo / hi : NaN;
    document.getElementById("faOut").innerHTML = kpi("Auswahlquote A", fmt(qa * 100) + " %") + kpi("Auswahlquote B", fmt(qb * 100) + " %") +
      kpi("Verhältnis niedrig/hoch", fmt(ratio, 2)) + kpi("Differenz", fmt(Math.abs(qa - qb) * 100) + " Pp.");
    document.getElementById("faNote").textContent = isFinite(ratio) ? (ratio < 0.8 ? "Unter 0,8: nach der 80-%-Regel ein Hinweis auf Benachteiligung – Ursachen prüfen." : "Mindestens 0,8: nach der 80-%-Regel unauffällig. Andere Fairnessmaße trotzdem prüfen.") : "";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
