<script>
/* Rechner in Modul 15 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["pbS", "pbV", "pbR", "pbB", "pbA", "pbZ"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var roh = v[1] ? v[0] / v[1] * (1 + v[2] / 100) : NaN, brutto = Math.ceil(roh - 1e-9);
    var verf = v[3] - v[4] + v[5], netto = brutto - verf;
    document.getElementById("pbOut").innerHTML = kpi("rechnerischer Bedarf", fmt(roh, 2) + " VZ") + kpi("Bruttobedarf (aufgerundet)", fmt(brutto)) +
      kpi("verfügbar (Bestand − Abgänge + Zugänge)", fmt(verf)) + kpi(netto >= 0 ? "Nettobedarf: einstellen" : "Überdeckung", fmt(Math.abs(netto)));
    document.getElementById("pbNote").textContent = netto < 0 ? "Es sind mehr Personen verfügbar als benötigt – Einsatz, Umschulung oder Abbau planen." : "Netto = Brutto − (Bestand − Abgänge + Zugänge). VZ = Vollzeitkräfte.";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
