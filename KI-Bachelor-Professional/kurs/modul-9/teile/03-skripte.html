<script>
/* Rechner in Modul 9 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d === undefined ? 0 : d, maximumFractionDigits: d === undefined ? 1 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["evBac", "evPv", "evEv", "evAc"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.max(0, +e.value || 0); });
    var bac = v[0], pv = v[1], ev = v[2], ac = v[3];
    var cv = ev - ac, sv = ev - pv, cpi = ac ? ev / ac : NaN, spi = pv ? ev / pv : NaN;
    var eac = cpi ? bac / cpi : NaN, etc = eac - ac, vac = bac - eac, fg = bac ? ev / bac : NaN;
    document.getElementById("evOut").innerHTML = kpi("Kostenabweichung CV", fmt(cv)) + kpi("Terminabweichung SV", fmt(sv)) + kpi("CPI", fmt(cpi, 2)) + kpi("SPI", fmt(spi, 2)) +
      kpi("Fertigstellungsgrad", fmt(fg * 100) + " %") + kpi("Prognose EAC", fmt(eac)) + kpi("Restkosten ETC", fmt(etc)) + kpi("Abweichung am Ende VAC", fmt(vac));
    var k = !isFinite(cpi) ? "" : cpi < 0.98 ? "über Budget" : cpi > 1.02 ? "unter Budget" : "im Budget";
    var t = !isFinite(spi) ? "" : spi < 0.98 ? "hinter dem Plan" : spi > 1.02 ? "vor dem Plan" : "im Plan";
    document.getElementById("evNote").textContent = (k && t ? "Das Projekt liegt " + k + " und " + t + ". " : "") + "CPI = EV / AC, SPI = EV / PV, EAC = BAC / CPI, ETC = EAC − AC, VAC = BAC − EAC.";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
