/* Rechner in Modul 11 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var av = ["avA", "avAs", "avB", "avBs", "avV"].map(function (id) { return document.getElementById(id); });
  function angebote() {
    var v = av.map(function (e) { return Math.max(0, +e.value || 0); });
    var aB = v[0] * (1 + v[1] / 100), bB = v[2] * (1 + v[3] / 100), vst = v[4] >= 1;
    var aE = vst ? v[0] : aB, bE = vst ? v[2] : bB;
    document.getElementById("avOut").innerHTML = kpi("A brutto", fmt(aB) + " €") + kpi("B brutto", fmt(bB) + " €") + kpi("A effektiv", fmt(aE) + " €") + kpi("B effektiv", fmt(bE) + " €") +
      kpi("günstiger", aE === bE ? "gleich" : aE < bE ? "A um " + fmt(bE - aE) + " €" : "B um " + fmt(aE - bE) + " €");
    document.getElementById("avNote").textContent = vst ? "Mit Vorsteuerabzug zählt der Nettopreis." : "Ohne Vorsteuerabzug zählt der Bruttopreis.";
  }
  av.forEach(function (e) { e.addEventListener("input", angebote); }); angebote();

  var es = ["esG", "esH", "esK"].map(function (id) { return document.getElementById(id); });
  function ertrag() {
    var g = Math.max(0, +es[0].value || 0), h = Math.max(0, +es[1].value || 0), k = Math.max(0, +es[2].value || 0);
    var kst = g * k / 100, soli = kst * 0.055, gew = g * 0.035 * h / 100, sum = kst + soli + gew;
    var ezu = Math.max(0, g - 24500) * 0.035 * h / 100;
    document.getElementById("esOut").innerHTML = kpi("Körperschaftsteuer", fmt(kst) + " €") + kpi("Solidaritätszuschlag", fmt(soli) + " €") + kpi("Gewerbesteuer", fmt(gew) + " €") +
      kpi("Summe", fmt(sum) + " €") + kpi("Belastung", fmt(g ? sum / g * 100 : NaN, 1) + " %") + kpi("Gewinn nach Steuern", fmt(g - sum) + " €");
    document.getElementById("esNote").textContent = "Zum Vergleich: Gewerbesteuer eines Einzelunternehmens mit gleichem Gewinn (Freibetrag 24.500 €): " + fmt(ezu) + " €, weitgehend auf die Einkommensteuer anrechenbar. Vereinfacht ohne Hinzurechnungen und Kürzungen.";
  }
  es.forEach(function (e) { e.addEventListener("input", ertrag); }); ertrag();
})();
