  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var u = document.getElementById("bgU"), k = document.getElementById("bgK");
  function rechne() {
    var um = Math.max(0, +u.value || 0), kmu = (+k.value || 0) >= 1;
    function ai(fix, pct) { var a = fix, b = um * pct / 100; return kmu ? Math.min(a, b) : Math.max(a, b); }
    function gd(fix, pct) { return Math.max(fix, um * pct / 100); }
    document.getElementById("bgOut").innerHTML = kpi("KI-VO: verbotene Praktik", fmt(ai(35, 7)) + " Mio. €") + kpi("KI-VO: andere Pflichten", fmt(ai(15, 3)) + " Mio. €") +
      kpi("KI-VO: falsche Angaben", fmt(ai(7.5, 1)) + " Mio. €") + kpi("DSGVO: schwere Verstöße", fmt(gd(20, 4)) + " Mio. €") + kpi("DSGVO: übrige Verstöße", fmt(gd(10, 2)) + " Mio. €");
