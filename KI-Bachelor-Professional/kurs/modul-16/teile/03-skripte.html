/* Rechner in Modul 16 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["urT", "urM", "urG"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var t = Math.min(6, Math.max(1, +el[0].value || 0)), m = Math.max(0, +el[1].value || 0), g = Math.max(0, +el[2].value || 0);
    var url = 24 / 6 * t, std = m ? g / m : NaN;
    document.getElementById("urOut").innerHTML = kpi("gesetzlicher Mindesturlaub", fmt(url, 1) + " Arbeitstage") + kpi("Minijob: höchstens", fmt(std, 1) + " Std. im Monat") + kpi("≈ je Woche", fmt(std / 4.33, 1) + " Std.");
    document.getElementById("urNote").textContent = "Urlaub = 24 Werktage / 6 × Arbeitstage je Woche. Minijob-Stunden = Verdienstgrenze / Stundenlohn.";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
