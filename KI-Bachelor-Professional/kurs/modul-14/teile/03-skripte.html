/* Rechner in Modul 14 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var be = ["beF", "beV", "beP", "beM"].map(function (id) { return document.getElementById(id); });
  function breakeven() {
    var v = be.map(function (e) { return Math.max(0, +e.value || 0); });
    var db = v[2] - v[1], bem = db > 0 ? v[0] / db : NaN, erg = v[3] * db - v[0];
    document.getElementById("beOut").innerHTML = kpi("DB je Stück", fmt(db, 3) + " €") + kpi("Break-even-Menge", isFinite(bem) ? fmt(Math.ceil(bem - 1e-9)) : "nie") +
      kpi("Ergebnis bei Menge", fmt(erg) + " €") + kpi("Sicherheitsabstand", isFinite(bem) && v[3] ? fmt((v[3] - bem) / v[3] * 100, 1) + " %" : "–");
    document.getElementById("beNote").textContent = db <= 0 ? "Der Preis deckt nicht einmal die variablen Kosten – jeder Verkauf erhöht den Verlust." : "Sicherheitsabstand: um wie viel Prozent die Menge sinken darf, bevor Verlust entsteht.";
  }
  be.forEach(function (e) { e.addEventListener("input", breakeven); }); breakeven();

  var kw = ["kwI", "kwR", "kwN", "kwZ"].map(function (id) { return document.getElementById(id); });
  function c0(I, R, n, i) { var s = 0; for (var t = 1; t <= n; t++) s += R / Math.pow(1 + i, t); return s - I; }
  function kapitalwert() {
    var I = Math.max(0, +kw[0].value || 0), R = +kw[1].value || 0, n = Math.max(0, Math.round(+kw[2].value || 0)), i = (+kw[3].value || 0) / 100;
    var C = c0(I, R, n, i), bw = C + I;
    var irr = NaN;
    if (c0(I, R, n, 0) > 0 && c0(I, R, n, 10) < 0) { var lo = 0, hi = 10; for (var k = 0; k < 100; k++) { var m = (lo + hi) / 2; if (c0(I, R, n, m) > 0) lo = m; else hi = m; } irr = lo; }
    var af = i ? i * Math.pow(1 + i, n) / (Math.pow(1 + i, n) - 1) : (n ? 1 / n : NaN);
    var dyn = NaN, cum = 0; for (var t = 1; t <= n; t++) { var prev = cum; cum += R / Math.pow(1 + i, t); if (cum >= I) { dyn = t - 1 + (I - prev) / (cum - prev); break; } }
    document.getElementById("kwOut").innerHTML = kpi("Summe der Barwerte", fmt(bw) + " €") + kpi("Kapitalwert C₀", (C >= 0 ? "+ " : "− ") + fmt(Math.abs(C)) + " €") +
      kpi("interner Zinsfuß", isFinite(irr) ? fmt(irr * 100, 2) + " %" : "–") + kpi("Annuität", fmt(C * af) + " € je Jahr") + kpi("dynamische Amortisation", isFinite(dyn) ? fmt(dyn, 2) + " Jahre" : "nicht in der Laufzeit");
    document.getElementById("kwNote").textContent = C >= 0 ? "Die Investition lohnt sich beim gewählten Kalkulationszins." : "Beim gewählten Zins lohnt sich die Investition nicht.";
  }
  kw.forEach(function (e) { e.addEventListener("input", kapitalwert); }); kapitalwert();
})();
</script>
