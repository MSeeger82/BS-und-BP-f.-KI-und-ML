<script>
/* Rechner in Modul 5 */
(function () {
  function parseList(s) { return s.split(/[;\s]+/).map(function (t) { return t.trim().replace(",", "."); }).filter(function (t) { return t !== ""; }).map(Number).filter(function (n) { return isFinite(n); }); }
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 4 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var ix = document.getElementById("nX"), iw = document.getElementById("nW"), ib = document.getElementById("nB"), ifn = document.getElementById("nF");
  function rechne() {
    var x = parseList(ix.value), w = parseList(iw.value), b = parseList(ib.value)[0] || 0, out = document.getElementById("nOut");
    if (!x.length || x.length !== w.length) { out.innerHTML = kpi("Hinweis", "gleich viele x und w"); return; }
    var z = b;
    for (var i = 0; i < x.length; i++) z += x[i] * w[i];
    var f = ifn.value, a;
    if (f === "relu") a = Math.max(0, z);
    else if (f === "sigmoid") a = 1 / (1 + Math.exp(-z));
    else if (f === "tanh") a = Math.tanh(z);
    else a = z;
    out.innerHTML = kpi("Summe z", fmt(z)) + kpi("Ausgabe a", fmt(a)) + (f === "sigmoid" ? kpi("als Prozent", fmt(a * 100, 1) + " %") : "");
  }
  [ix, iw, ib].forEach(function (e) { e.addEventListener("input", rechne); }); ifn.addEventListener("change", rechne); rechne();
})();
</script>
