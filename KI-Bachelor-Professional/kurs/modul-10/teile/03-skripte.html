/* Rechner in Modul 10 */
(function () {
  function fmt(x, d) { return isFinite(x) ? x.toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 1 : d }) : "–"; }
  var kpi = function (l, w) { return '<div class="kpi"><span>' + l + "</span><b>" + w + "</b></div>"; };
  var el = ["ucN", "ucD", "ucT", "ucR", "ucK"].map(function (id) { return document.getElementById(id); });
  function rechne() {
    var v = el.map(function (e) { return Math.min(10, Math.max(1, +e.value || 1)); });
    var n = v[0], m = (v[1] + v[2] + v[3] + v[4]) / 4;
    var q = n > 5 ? (m > 5 ? "zuerst umsetzen (Quick Win)" : "strategisch: Voraussetzungen schaffen") : (m > 5 ? "nebenbei mitnehmen" : "zurückstellen");
    var schwach = ["Datenlage", "Technische Reife", "Rechtlich", "Kompetenz"].filter(function (_, i) { return v[i + 1] <= 4; });
    document.getElementById("ucOut").innerHTML = kpi("Nutzen", fmt(n)) + kpi("Machbarkeit (Mittel)", fmt(m, 2)) + kpi("Priorität Nutzen × Machbarkeit", fmt(n * m)) + kpi("Feld im Portfolio", q);
    document.getElementById("ucNote").textContent = (schwach.length ? "Engpass: " + schwach.join(", ") + ". " : "") + "Über 5 gilt als hoch. Ein sehr niedriger Rechtswert kann ein Ausschlusskriterium sein (z. B. verbotene Praxis nach AI Act).";
  }
  el.forEach(function (e) { e.addEventListener("input", rechne); }); rechne();
})();
</script>
